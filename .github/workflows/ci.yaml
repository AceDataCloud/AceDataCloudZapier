name: Zapier Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  zapier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
